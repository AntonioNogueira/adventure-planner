<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=540" />
<title>Carousel</title>
<style>
  html, body { margin: 0; background: #fffcf4; font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; color: #1e293b; }
  .slide { position: relative; width: 540px; height: 675px; overflow: hidden; background: #fffcf4; box-sizing: border-box; }
  .pad { padding: 34px 34px 0; }
  .kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #047857; font-weight: 700; }
  h1 { font-size: 40px; line-height: 1.05; margin: 10px 0 12px; letter-spacing: -.01em; }
  h2 { font-size: 28px; line-height: 1.1; margin: 8px 0 6px; }
  p { margin: 0; }
  .lede { font-size: 17px; line-height: 1.4; color: #334155; }
  .num { display: inline-flex; width: 38px; height: 38px; border-radius: 50%; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; }
  .map { display: block; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .fact { background: #fff; border: 1px solid #e7e0cf; border-radius: 10px; padding: 8px 10px; }
  .fact b { display: block; font-size: 15px; } .fact span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; font-weight: 700; }
  .why { font-size: 15px; line-height: 1.4; margin-top: 12px; color: #334155; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,22,34,.15) 0%, rgba(11,22,34,.05) 35%, rgba(11,22,34,.85) 100%); }
  .over { position: absolute; left: 34px; right: 34px; bottom: 70px; color: #fff; }
  .over .kicker { color: #6ee7b7; }
  .credit { position: absolute; right: 10px; top: 10px; font-size: 8px; color: rgba(255,255,255,.75); }
  .foot { position: absolute; left: 34px; right: 34px; bottom: 18px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: #94a3b8; }
  .dark .foot { color: rgba(255,255,255,.8); }
  .cta { display: inline-block; background: #047857; color: #fff; padding: 14px 20px; border-radius: 12px; font-weight: 700; font-size: 19px; margin-top: 18px; }
  .swipe { position: absolute; right: 34px; bottom: 44px; font-size: 13px; font-weight: 700; color: #047857; }
  .dark .swipe { color: #fff; }
  ul.stops { list-style: none; padding: 0; margin: 14px 0 0; } ul.stops li { font-size: 15px; line-height: 1.35; margin: 0 0 10px; display: flex; gap: 10px; }
  ul.stops .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./carousel.ts"></script>
</body>
</html>
