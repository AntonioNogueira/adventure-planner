# Render blueprint: https://render.com → New → Blueprint → pick this repository.
# Render asks for the secret values (sync: false) when the service is created.
services:
  - type: web
    name: adventure-planner
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_REQUESTS_PER_HOUR
        value: "60"
      # Plans: grant test plans by email; checkout links for the Upgrade buttons (optional).
      - key: PLAN_OVERRIDES
        sync: false
      - key: CHECKOUT_URL_EXPLORER
        sync: false
      # Affiliate ids for the booking links in place popups (optional).
      - key: BOOKING_AID
        sync: false
      - key: GETYOURGUIDE_PARTNER_ID
        sync: false
      - key: AFFILIATE_HOSTELS_URL
        sync: false
      - key: AFFILIATE_CAMPSITES_URL
        sync: false
      - key: AFFILIATE_RENTALS_URL
        sync: false

  # Adventure Planner Open: the same code with OpenStreetMap services (no Google Maps key).
  - type: web
    name: adventure-planner-open
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAP_PROVIDER
        value: osm
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_REQUESTS_PER_HOUR
        value: "60"
      # Plans: grant test plans by email; checkout links for the Upgrade buttons (optional).
      - key: PLAN_OVERRIDES
        sync: false
      - key: CHECKOUT_URL_EXPLORER
        sync: false
