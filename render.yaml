# Render blueprint: https://render.com → New → Blueprint → pick this repository.
# Render asks for the secret values (sync: false) when the service is created.
services:
  - type: web
    name: adventure-planner
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Claude is tried first when its key is set (from platform.claude.com, billed separately from a Claude.ai plan).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_REQUESTS_PER_HOUR
        value: "60"
      # Plans: grant test plans by email; checkout links for the Upgrade buttons (optional).
      - key: PLAN_OVERRIDES
        sync: false
      # Set to "true" at launch to enforce the plans' daily limits (off while testing).
      - key: ENFORCE_LIMITS
        sync: false
      - key: CHECKOUT_URL_EXPLORER
        sync: false
      # Affiliate ids for the booking links in place popups (optional).
      - key: BOOKING_AID
        sync: false
      - key: GETYOURGUIDE_PARTNER_ID
        sync: false
      - key: AFFILIATE_HOSTELS_URL
        sync: false
      - key: AFFILIATE_CAMPSITES_URL
        sync: false
      - key: AFFILIATE_RENTALS_URL
        sync: false
      # OpenStreetMap servers (optional): your own or paid ones; empty = the free public servers.
      # OVERPASS_URL takes several, comma-separated, tried in order (see deploy/places-server).
      - key: OVERPASS_URL
        sync: false
      - key: PHOTON_URL
        sync: false
      - key: NOMINATIM_URL
        sync: false
      - key: OSRM_URL
        sync: false
      - key: VALHALLA_URL
        sync: false
      - key: BROUTER_URL
        sync: false
      - key: ELEVATION_URL
        sync: false
      # MapTiler browser key: second place-name service (restrict it to this site in MapTiler Cloud).
      - key: MAPTILER_KEY
        sync: false
